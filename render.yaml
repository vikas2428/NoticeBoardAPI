services:
  - type: web
    name: notice-board-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: APP_NAME
        value: Notice Board API

      - key: APP_VERSION
        value: 1.0.0

      - key: DEBUG
        value: "False"

      - key: DATABASE_PATH
        value: /var/data/notice_board.db